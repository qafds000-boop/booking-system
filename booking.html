<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加強時段預約</title>
<style>
  :root {
    --brand: #3f6fb0;
    --brand-dark: #274c7c;
    --bg: #eef3fa;
    --card: #ffffff;
    --border: #c9d9ec;
    --text: #22314a;
    --muted: #5b6b82;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    margin: 8px 0 4px;
    color: var(--brand-dark);
  }
  h2 {
    font-size: 15px;
    color: var(--brand-dark);
    margin: 0 0 8px;
  }
  .sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .week-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .week-toggle button {
    flex: 1;
    background: #fff;
    color: var(--text);
    border: none;
    border-radius: 0;
    padding: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .week-toggle button.active {
    background: var(--brand);
    color: #fff;
  }
  .day {
    margin-bottom: 18px;
  }
  .day-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--brand-dark);
  }
  .holiday-badge {
    display: inline-block;
    background: #eee;
    color: #888;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .lock-badge {
    display: inline-block;
    background: #f5e6d3;
    color: #8a5a2a;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .slot-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .slot-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .slot-name {
    font-size: 14px;
    font-weight: 600;
  }
  .slot-time {
    font-size: 12px;
    color: var(--muted);
  }
  .count-badge {
    font-size: 12px;
    color: var(--brand);
    font-weight: 600;
    white-space: nowrap;
  }
  .form-row {
    display: flex;
    gap: 8px;
  }
  input[type=text], input[type=date] {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
  }
  button {
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
  }
  button:disabled { background: #ccc; }
  .msg {
    font-size: 12px;
    margin-top: 6px;
  }
  .msg.ok { color: #2a7a2a; }
  .msg.err { color: #b5301d; }
  .closed-note {
    font-size: 13px;
    color: #999;
    padding: 8px 0;
  }
  .loading, .empty {
    font-size: 13px;
    color: var(--muted);
    padding: 20px 0;
    text-align: center;
  }
  .class-select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 16px;
    background: #fff;
    color: var(--text);
  }
  .student-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    padding: 4px 0;
  }
  .student-list-wrap {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--border);
  }
  .cancel-btn {
    background: none;
    border: 1px solid var(--border);
    color: #b5301d;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: 400;
    border-radius: 6px;
  }
  .admin-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 20px;
  }
  .holiday-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    padding: 4px 0;
  }
</style>
</head>
<body>

<div style="display:flex;align-items:center;gap:12px;margin-bottom:4px;">
  <img src="./logo.jpg" alt="金牌躍騰內壢校" style="width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;">
  <h1 id="titleEl" onclick="handleTitleTap()" style="margin:0;">加強時段預約</h1>
</div>
<p class="sub">請選擇班級，輸入學生姓名並送出即完成預約</p>

<div class="week-toggle">
  <button id="btnThisWeek" class="active" onclick="switchWeek(0)">本週</button>
  <button id="btnNextWeek" onclick="switchWeek(1)">下週</button>
</div>

<select id="classSelect" class="class-select" style="display:none;"></select>

<div class="admin-panel" style="margin-bottom:16px;">
  <h2 style="margin-bottom:8px;">學生姓名</h2>
  <input type="text" id="studentNameInput" placeholder="輸入一次，下面各時段直接點按鈕即可">
</div>

<div id="adminPanel"></div>

<div id="app">
  <div class="loading">載入中...</div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzBn5rolCJezfaB3r12ImHdcOHoeduQs3YOd5X-YPkpluTX9u-Ts61W3_ugbwdlJSJu/exec';

const WEEKDAY_NAMES = ['', '週一', '週二', '週三', '週四', '週五', '週六', '週日'];

let currentClass = null;
let tapCount = 0;
let tapTimer = null;
let isAdmin = false;
let adminPin = null;
let lastHolidays = [];
let lastDays = [];
let weekOffset = 0;

function switchWeek(offset) {
  weekOffset = offset;
  document.getElementById('btnThisWeek').classList.toggle('active', offset === 0);
  document.getElementById('btnNextWeek').classList.toggle('active', offset === 1);
  loadData();
}

function handleTitleTap() {
  tapCount++;
  if (tapTimer) clearTimeout(tapTimer);
  tapTimer = setTimeout(function () { tapCount = 0; }, 2000);
  if (tapCount >= 5) {
    tapCount = 0;
    if (isAdmin) {
      isAdmin = false;
      adminPin = null;
      document.getElementById('adminPanel').innerHTML = '';
      loadData();
    } else {
      const pin = window.prompt('請輸入管理密碼');
      if (pin === '4628666') {
        isAdmin = true;
        adminPin = pin;
        loadData();
      } else if (pin !== null) {
        window.alert('密碼錯誤');
      }
    }
  }
}

function loadData() {
  const params = new URLSearchParams();
  if (currentClass) params.set('className', currentClass);
  params.set('weekOffset', weekOffset);
  const url = API_URL + '?' + params.toString();

  fetch(url)
    .then(function (res) { return res.json(); })
    .then(function (data) {
      setupClassSelect(data.classes);
      lastHolidays = data.holidays || [];
      lastDays = data.days || [];
      renderAdminPanel();
      renderDays(lastDays);
      setupNameInputListener();
    })
    .catch(function () {
      document.getElementById('app').innerHTML = '<div class="empty">載入失敗，請稍後再試</div>';
    });
}

function setupClassSelect(classes) {
  const select = document.getElementById('classSelect');
  if (!classes || classes.length === 0) return;

  if (!currentClass) {
    currentClass = classes[0];
  }

  select.innerHTML = '';
  classes.forEach(function (c) {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    if (c === currentClass) opt.selected = true;
    select.appendChild(opt);
  });
  select.style.display = classes.length > 1 ? 'block' : 'none';

  select.onchange = function () {
    currentClass = select.value;
    loadData();
  };
}

function renderAdminPanel() {
  const panel = document.getElementById('adminPanel');
  panel.innerHTML = '';
  if (!isAdmin) return;

  const box = document.createElement('div');
  box.className = 'admin-panel';

  const h2 = document.createElement('h2');
  h2.textContent = '管理模式';
  box.appendChild(h2);

  const backBtn = document.createElement('button');
  backBtn.textContent = '返回前台';
  backBtn.style.marginBottom = '12px';
  backBtn.style.background = '#fff';
  backBtn.style.color = 'var(--brand-dark)';
  backBtn.style.border = '1px solid var(--border)';
  backBtn.onclick = function () {
    isAdmin = false;
    adminPin = null;
    document.getElementById('adminPanel').innerHTML = '';
    loadData();
  };
  box.appendChild(backBtn);

  const h3 = document.createElement('h2');
  h3.textContent = '公休日管理';
  box.appendChild(h3);

  if (lastHolidays.length === 0) {
    const none = document.createElement('div');
    none.className = 'empty';
    none.style.padding = '4px 0';
    none.textContent = '目前沒有設定公休日';
    box.appendChild(none);
  } else {
    lastHolidays.forEach(function (dateStr) {
      const row = document.createElement('div');
      row.className = 'holiday-row';

      const label = document.createElement('span');
      label.textContent = dateStr;

      const removeBtn = document.createElement('button');
      removeBtn.className = 'cancel-btn';
      removeBtn.textContent = '移除';
      removeBtn.onclick = function () {
        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'removeHoliday', date: dateStr, pin: adminPin })
        })
          .then(function (res) { return res.json(); })
          .then(function (result) {
            if (result.success) loadData();
            else window.alert(result.error || '移除失敗');
          });
      };

      row.appendChild(label);
      row.appendChild(removeBtn);
      box.appendChild(row);
    });
  }

  const formRow = document.createElement('div');
  formRow.className = 'form-row';
  formRow.style.marginTop = '10px';

  const dateInput = document.createElement('input');
  dateInput.type = 'date';

  const addBtn = document.createElement('button');
  addBtn.textContent = '設定公休';

  addBtn.onclick = function () {
    if (!dateInput.value) {
      window.alert('請選擇日期');
      return;
    }
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'addHoliday', date: dateInput.value, pin: adminPin })
    })
      .then(function (res) { return res.json(); })
      .then(function (result) {
        if (result.success) loadData();
        else window.alert(result.error || '設定失敗');
      });
  };

  formRow.appendChild(dateInput);
  formRow.appendChild(addBtn);
  box.appendChild(formRow);

  panel.appendChild(box);
}

function setupNameInputListener() {
  const input = document.getElementById('studentNameInput');
  if (!input || input.dataset.bound) return;
  input.dataset.bound = '1';
  input.addEventListener('input', function () {
    renderDays(lastDays);
  });
}

function renderDays(days) {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const daysWithSlots = days.filter(function (d) { return d.slots.length > 0; });

  if (daysWithSlots.length === 0) {
    app.innerHTML = '<div class="empty">這週目前沒有開放的時段</div>';
    return;
  }

  daysWithSlots.forEach(function (day) {
    const dayDiv = document.createElement('div');
    dayDiv.className = 'day';

    const title = document.createElement('div');
    title.className = 'day-title';
    title.textContent = WEEKDAY_NAMES[day.weekday] + '（' + day.date + '）';
    if (day.closed) {
      const badge = document.createElement('span');
      badge.className = 'holiday-badge';
      badge.textContent = '公休';
      title.appendChild(badge);
    } else if (day.locked) {
      const badge = document.createElement('span');
      badge.className = 'lock-badge';
      badge.textContent = '已截止';
      title.appendChild(badge);
    }
    dayDiv.appendChild(title);

    if (day.closed) {
      const note = document.createElement('div');
      note.className = 'closed-note';
      note.textContent = '這天公休，暫不開放預約';
      dayDiv.appendChild(note);
    } else {
      day.slots.forEach(function (slot) {
        dayDiv.appendChild(renderSlotCard(day.date, slot, day.locked));
      });
    }

    app.appendChild(dayDiv);
  });
}

function renderSlotCard(date, slot, locked) {
  const card = document.createElement('div');
  card.className = 'slot-card';

  const nameInput = document.getElementById('studentNameInput');
  const currentName = nameInput ? nameInput.value.trim() : '';
  const isMineBooked = currentName && slot.students.indexOf(currentName) !== -1;

  const row = document.createElement('div');
  row.className = 'slot-row';
  const countText = isMineBooked ? '你已預約・共 ' + slot.count + ' 人' : '目前 ' + slot.count + ' 人';
  const countColor = isMineBooked ? '#2a7a2a' : 'var(--brand)';
  row.innerHTML =
    '<div><div class="slot-name">' + slot.subject + '　' + slot.name + '</div>' +
    '<div class="slot-time">' + slot.time + '</div></div>' +
    '<div class="count-badge" style="color:' + countColor + ';">' + countText + '</div>';
  card.appendChild(row);

  if (isAdmin) {
    const wrap = document.createElement('div');
    wrap.className = 'student-list-wrap';

    if (slot.students.length === 0) {
      const none = document.createElement('div');
      none.style.fontSize = '13px';
      none.style.color = 'var(--muted)';
      none.textContent = '目前沒有人預約';
      wrap.appendChild(none);
    } else {
      slot.students.forEach(function (name) {
        const srow = document.createElement('div');
        srow.className = 'student-row';

        const label = document.createElement('span');
        label.textContent = name;

        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'cancel-btn';
        cancelBtn.textContent = '取消';
        cancelBtn.onclick = function () {
          if (!window.confirm('確定要取消 ' + name + ' 這筆預約嗎？')) return;
          fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'cancel',
              date: date,
              className: currentClass,
              slotName: slot.name,
              time: slot.time,
              student: name,
              pin: adminPin
            })
          })
            .then(function (res) { return res.json(); })
            .then(function (result) {
              if (result.success) loadData();
              else window.alert(result.error || '取消失敗');
            });
        };

        srow.appendChild(label);
        srow.appendChild(cancelBtn);
        wrap.appendChild(srow);
      });
    }

    card.appendChild(wrap);
    return card;
  }

  // 家長端：已鎖定就只顯示提示，不能再異動
  if (locked) {
    const lockedNote = document.createElement('div');
    lockedNote.className = 'msg';
    lockedNote.style.color = 'var(--muted)';
    lockedNote.textContent = isMineBooked
      ? '已截止異動，如需調整請直接聯繫教室'
      : '已截止預約，如需調整請直接聯繫教室';
    card.appendChild(lockedNote);
    return card;
  }

  // 家長端：未鎖定，共用頁面上方的姓名欄位，這裡只放按鈕
  const formRow = document.createElement('div');
  formRow.className = 'form-row';

  const bookBtn = document.createElement('button');
  bookBtn.textContent = '我要預約';

  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = '取消預約';
  cancelBtn.style.background = '#fff';
  cancelBtn.style.color = '#b5301d';
  cancelBtn.style.border = '1px solid var(--border)';

  const msg = document.createElement('div');
  msg.className = 'msg';

  function getName() {
    const input = document.getElementById('studentNameInput');
    return input ? input.value.trim() : '';
  }

  bookBtn.addEventListener('click', function () {
    const name = getName();
    if (!name) {
      msg.className = 'msg err';
      msg.textContent = '請先在上方輸入學生姓名';
      return;
    }
    bookBtn.disabled = true;
    cancelBtn.disabled = true;
    msg.className = 'msg';
    msg.textContent = '送出中...';

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'book', date: date, className: currentClass, slotName: slot.name, time: slot.time, student: name })
    })
      .then(function (res) { return res.json(); })
      .then(function (result) {
        bookBtn.disabled = false;
        cancelBtn.disabled = false;
        if (result.success) {
          msg.className = 'msg ok';
          msg.textContent = '已完成預約';
          loadData();
        } else {
          msg.className = 'msg err';
          msg.textContent = result.error || '預約失敗，請稍後再試';
        }
      })
      .catch(function () {
        bookBtn.disabled = false;
        cancelBtn.disabled = false;
        msg.className = 'msg err';
        msg.textContent = '網路錯誤，請稍後再試';
      });
  });

  cancelBtn.addEventListener('click', function () {
    const name = getName();
    if (!name) {
      msg.className = 'msg err';
      msg.textContent = '請先在上方輸入學生姓名';
      return;
    }
    if (!window.confirm('確定要取消 ' + name + ' 這筆預約嗎？')) return;
    bookBtn.disabled = true;
    cancelBtn.disabled = true;
    msg.className = 'msg';
    msg.textContent = '處理中...';

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'selfCancel', date: date, className: currentClass, slotName: slot.name, time: slot.time, student: name })
    })
      .then(function (res) { return res.json(); })
      .then(function (result) {
        bookBtn.disabled = false;
        cancelBtn.disabled = false;
        if (result.success) {
          msg.className = 'msg ok';
          msg.textContent = '已取消預約';
          loadData();
        } else {
          msg.className = 'msg err';
          msg.textContent = result.error || '取消失敗，請稍後再試';
        }
      })
      .catch(function () {
        bookBtn.disabled = false;
        cancelBtn.disabled = false;
        msg.className = 'msg err';
        msg.textContent = '網路錯誤，請稍後再試';
      });
  });

  formRow.appendChild(bookBtn);
  formRow.appendChild(cancelBtn);
  card.appendChild(formRow);
  card.appendChild(msg);

  return card;
}

loadData();
</script>

</body>
</html>
